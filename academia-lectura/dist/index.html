<script id="book-data" type="application/json">[{"title": "Estrategia buena, estrategia mala", "author": "Richard Rumelt", "idea": "Una estrategia útil identifica un desafío concreto y concentra decisiones y recursos para resolverlo. Una lista de metas expresa aspiraciones, pero necesita un diagnóstico y un enfoque para convertirse en estrategia.", "points": [["El núcleo estratégico", "Diagnóstico: explicar la naturaleza del problema. Política orientadora: escoger el enfoque para enfrentarlo. Acciones coherentes: coordinar decisiones y recursos que ejecuten ese enfoque."], ["Señales de mala estrategia", "Lenguaje grandioso sin contenido, evasión del desafío, metas confundidas con decisiones y objetivos incompatibles. Crecer o ser excelentes no explica cómo lograrlo."], ["Concentración y ventaja", "La coordinación y el enfoque pueden producir ventajas mayores que iniciativas dispersas. La estrategia requiere elegir prioridades y renunciar a actividades que consumen recursos sin apoyar el propósito."], ["Comprender el sistema", "Una debilidad crítica puede impedir que otras mejoras produzcan resultados. Antes de expandirse, conviene identificar obstáculos, capacidades y relaciones entre las partes del negocio."], ["Pensamiento estratégico", "Cuestionar supuestos, formular hipótesis y aprender de la evidencia. El criterio estratégico se desarrolla revisando qué ocurrió y ajustando el enfoque."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Penguin Random House · Good Strategy Bad Strategy", "url": "https://www.penguinrandomhouse.com/books/208668/good-strategy-bad-strategy-by-richard-rumelt/", "id": "01", "category": "Estrategia", "accent": "#b69765"}, {"title": "El arte de la ejecución en los negocios", "author": "Larry Bossidy y Ram Charan", "idea": "Ejecutar es una disciplina de dirección: conectar objetivos, personas y operaciones para producir resultados. Los acuerdos necesitan responsables, recursos, seguimiento y conversaciones basadas en la realidad.", "points": [["Conocer la realidad", "El líder necesita comprender el negocio, las personas y las dificultades reales. Los planes pierden fuerza cuando se construyen sobre supuestos que nadie cuestiona."], ["Siete comportamientos", "Conocer personas y negocio; insistir en el realismo; fijar prioridades; dar seguimiento; reconocer resultados; desarrollar capacidades; y conocerse a sí mismo."], ["Proceso de personas", "Evaluar quién puede asumir cada responsabilidad, qué capacidades necesita desarrollar y cómo preparar continuidad. La asignación adecuada influye en la viabilidad del plan."], ["Proceso de estrategia", "Comprobar que el enfoque responde al entorno y que la organización puede ejecutarlo. La ambición necesita capacidades y decisiones concretas."], ["Proceso de operaciones", "Traducir la estrategia en compromisos, recursos, fechas y resultados. Revisar obstáculos y actuar sobre desviaciones antes de que se acumulen."], ["Cultura de ejecución", "Promover diálogo franco y comportamientos coherentes con los resultados. El líder participa en decisiones esenciales y desarrolla a quienes ejecutan, sin intervenir en cada detalle."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Penguin Random House · Execution", "url": "https://www.penguinrandomhouse.com/books/16316/execution-by-larry-bossidy-and-ram-charan/", "id": "02", "category": "Ejecución", "accent": "#557c88"}, {"title": "Measure What Matters", "author": "John Doerr", "idea": "Los OKR conectan objetivos importantes con resultados clave verificables. Su utilidad consiste en concentrar esfuerzos, coordinar áreas y hacer visible el avance hacia una mejora.", "points": [["Objetivo y resultado clave", "El objetivo expresa qué se quiere conseguir. Los resultados clave permiten comprobarlo. Celebrar reuniones es una actividad; reducir errores o mejorar entregas es un resultado."], ["Enfoque y alineación", "Escoger pocas prioridades y hacerlas visibles. Cada área comprende cómo contribuye y qué depende de otras personas o equipos."], ["Compromiso y seguimiento", "Revisar avances durante el periodo, detectar bloqueos y ajustar acciones. Medir al final puede llegar demasiado tarde para corregir."], ["Metas exigentes", "Distinguir compromisos que deben cumplirse de aspiraciones que buscan ampliar capacidades. Mezclarlos produce expectativas confusas."], ["CFR", "Conversaciones, retroalimentación y reconocimiento acompañan los indicadores. Permiten comprender obstáculos, orientar el desempeño y reconocer contribuciones."], ["Criterio y cultura", "Los OKR necesitan liderazgo y una cultura que permita hablar con honestidad sobre resultados. No sustituyen el juicio profesional ni convierten toda tarea en una prioridad."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "What Matters · Beneficios de OKR y cultura", "url": "https://www.whatmatters.com/okrs-explained/benefits-of-okrs", "id": "03", "category": "Medición", "accent": "#b18059"}, {"title": "El ejecutivo eficaz", "author": "Peter F. Drucker", "idea": "La eficacia se aprende mediante hábitos que convierten conocimiento y esfuerzo en contribución. Estar ocupado no demuestra que se estén produciendo los resultados que necesita la organización.", "points": [["Conocer el tiempo", "Registrar cómo se utiliza, eliminar consumos innecesarios y reunir bloques suficientes para el trabajo importante. Diagnosticar antes de atribuir el problema a falta de tiempo."], ["Concentrarse en la contribución", "Preguntar qué resultado necesita la organización del puesto. La responsabilidad se define por su aporte y no solamente por la cantidad de tareas realizadas."], ["Aprovechar fortalezas", "Asignar responsabilidades considerando capacidades reales. Complementar debilidades relevantes y organizar el trabajo para hacer productivas las fortalezas."], ["Establecer prioridades", "Atender lo que aporta mayor valor y decidir qué dejar de hacer. Intentar avanzar en todo fragmenta la atención y reduce la efectividad."], ["Decidir con eficacia", "Definir el problema y las condiciones que debe cumplir una solución; considerar alternativas y convertir la decisión en acción."], ["Verificar resultados", "Comprobar qué ocurrió después de decidir. La retroalimentación permite corregir supuestos y mejorar decisiones posteriores."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "HarperCollins · descripción editorial en Google Books", "url": "https://books.google.com/books/about/The_Effective_Executive.html?id=OhcZDAAAQBAJ", "id": "04", "category": "Liderazgo", "accent": "#66795b"}, {"title": "Vendes o vendes", "author": "Grant Cardone", "idea": "La venta es una capacidad para comunicar ideas, conseguir acuerdos y generar confianza. Cardone insiste en profesionalizarla mediante preparación, práctica y actividad comercial constante.", "points": [["Convicción y preparación", "Conocer la propuesta y creer en su utilidad ayuda a comunicarla con claridad. La convicción debe apoyarse en resultados y capacidades que realmente pueden entregarse."], ["Comprender al comprador", "Investigar qué valora, qué necesita y qué dudas tiene. La confianza influye en cómo interpreta una oferta."], ["Valor y precio", "Una objeción de precio puede relacionarse con dudas sobre utilidad, confianza o adecuación. También puede existir una limitación económica real que requiere diagnóstico."], ["Seguimiento", "Mantener continuidad, solicitar próximos pasos y registrar oportunidades. La actividad comercial necesita constancia y administración del tiempo."], ["Relaciones existentes", "Clientes y contactos que conocen la organización pueden facilitar conversaciones y recomendaciones. Esas relaciones requieren cuidado y aportación de valor."], ["Entrenamiento", "Practicar presentación, escucha y respuesta a objeciones. Revisar conversaciones para mejorar el desempeño y aprender de los resultados."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Grant Cardone · Sell or Be Sold, texto del libro", "url": "https://s3.amazonaws.com/gcdownload/sell_or_be_sold_ebook.pdf", "id": "05", "category": "Ventas", "accent": "#9b665c"}, {"title": "SPIN Selling", "author": "Neil Rackham", "idea": "Las ventas complejas necesitan una conversación que permita comprender necesidades, consecuencias y valor. Presentar una solución antes de diagnosticar limita la calidad de la propuesta.", "points": [["Situación", "Conocer el contexto relevante: operación, sistemas y decisiones. Evitar recopilar información que ya puede conocerse o que no aporta al diagnóstico."], ["Problema", "Identificar dificultades, insatisfacciones o necesidades. Escuchar lo que el prospecto reconoce, sin atribuirle problemas que no ha expresado."], ["Implicación", "Explorar consecuencias sobre dinero, tiempo, operación o decisiones. Ayudar a comprender la importancia del problema sin exagerar riesgos."], ["Necesidad-beneficio", "Invitar al comprador a expresar qué valor tendría resolverlo. Una necesidad implícita se vuelve explícita cuando reconoce una solución que desea implementar."], ["Capacidades y beneficios", "Conectar la propuesta con necesidades identificadas. Una característica adquiere valor cuando resuelve algo importante para ese comprador."], ["Avance de la decisión", "Cerrar con un compromiso que permita progresar: reunir información, involucrar a un decisor o revisar una propuesta. SPIN es una estructura flexible, no un interrogatorio."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Huthwaite International · metodología SPIN", "url": "https://www.huthwaiteinternational.com/spin-methodology", "id": "06", "category": "Ventas", "accent": "#64788c"}, {"title": "La psicología del dinero", "author": "Morgan Housel", "idea": "El comportamiento influye profundamente en los resultados financieros. La paciencia, las expectativas y el manejo de la incertidumbre importan junto con los conocimientos técnicos.", "points": [["Historia, suerte y riesgo", "Las experiencias personales forman perspectivas distintas sobre dinero. Suerte y riesgo participan en los resultados; un éxito no prueba que toda decisión haya sido correcta."], ["Suficiente y autonomía", "Definir cuánto es suficiente reduce riesgos por comparación. El dinero puede aportar control del tiempo y opciones; el consumo visible no demuestra patrimonio."], ["Tiempo y conservación", "El crecimiento compuesto necesita continuidad. Crear riqueza y conservarla exigen capacidades diferentes: ambición para generar y prudencia para permanecer."], ["Ahorro y margen", "Ahorrar produce flexibilidad. La incertidumbre y las sorpresas requieren margen de seguridad y planes que puedan sostenerse en momentos difíciles."], ["Objetivos personales", "Las personas cambian. Copiar decisiones de otros puede fallar cuando sus necesidades, plazos y tolerancia al riesgo son diferentes."], ["Juicio financiero", "El pesimismo y los relatos convincentes pueden distorsionar decisiones. Una estrategia razonable y sostenible puede resultar más útil que una teóricamente perfecta."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Harriman House · The Psychology of Money; ensayo de Morgan Housel", "url": "https://collabfund.com/blog/the-psychology-of-money/", "id": "07", "category": "Finanzas", "accent": "#8b785e"}, {"title": "La meta", "author": "Eliyahu M. Goldratt y Jeff Cox", "idea": "La novela sigue a Alex Rogo, gerente de una planta amenazada con cierre. Con Jonah descubre que mantener a todos ocupados no garantiza mejores resultados: una restricción limita el rendimiento del sistema.", "points": [["Resultado global", "Las mejoras deben contribuir al resultado del conjunto. Optimizar una etapa que no determina el flujo puede acumular trabajo sin aumentar entregas."], ["Medidas del sistema", "El libro analiza generación de dinero mediante ventas, inversión en inventario y gasto de operación. Estas medidas relacionan operación y resultado económico."], ["Identificar y aprovechar", "Primero localizar la restricción y utilizar mejor su capacidad actual. Evitar que pierda tiempo en trabajo innecesario o por información incompleta."], ["Subordinar y elevar", "Coordinar las demás etapas alrededor de la restricción. Si aún limita el resultado, aumentar su capacidad con una decisión justificada."], ["Repetir la mejora", "Cuando cambia la restricción, volver a analizar el sistema. La inercia y las políticas anteriores pueden convertirse en nuevos obstáculos."], ["Variabilidad y dependencia", "Las fluctuaciones y la dependencia entre etapas producen retrasos. Proteger el flujo requiere controlar trabajo acumulado y evitar sobrecarga."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Goldratt Marketing · The Goal; guía de conceptos", "url": "https://www.toc-goldratt.com/en/product/the-goal-movie", "id": "08", "category": "Operaciones", "accent": "#637d75"}, {"title": "Conversaciones cruciales", "author": "Kerry Patterson, Joseph Grenny, Ron McMillan y Al Switzler", "idea": "Una conversación es crucial cuando hay mucho en juego, opiniones diferentes y emociones intensas. El libro enseña a sostener diálogo para compartir información y llegar a acuerdos.", "points": [["Comenzar por el propósito", "Definir qué deseas para ti, la otra persona y la relación. Evitar que el objetivo se transforme en ganar una discusión."], ["Observar señales", "Reconocer silencio, retirada o imposición cuando se pierde seguridad. Detectarlas temprano permite reparar la conversación."], ["Crear seguridad", "Demostrar respeto y buscar un propósito compartido. La seguridad permite conversar sobre desacuerdos y asuntos difíciles."], ["Separar hechos e historias", "Distinguir lo observado de las interpretaciones sobre intención. Revisar supuestos antes de atribuir desinterés o mala voluntad."], ["Exponer y explorar", "Compartir hechos y perspectiva con prudencia; invitar otras opiniones, escuchar y verificar comprensión. Abrir espacio a información que puede faltar."], ["Pasar a la acción", "Definir cómo se decidirá, quién hará qué, fecha y seguimiento. Una conversación útil termina con claridad sobre los compromisos."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "McGraw Hill · Crucial Conversations, segunda edición", "url": "https://www.mheducation.com/highered/mhp/product/crucial-conversations-tools-talking-when-stakes-high-second-edition.html", "id": "09", "category": "Comunicación", "accent": "#8b6d84"}, {"title": "¡Clientes fanáticos!", "author": "Ken Blanchard y Sheldon Bowles", "idea": "Una experiencia confiable puede motivar al cliente a recomendar la organización. El libro presenta una parábola sobre definir el servicio, escuchar al cliente y mejorar de forma continua.", "points": [["Decidir", "Definir qué experiencia quiere ofrecer la empresa y cuál puede sostener. La visión orienta procesos, expectativas y decisiones del equipo."], ["Descubrir", "Escuchar qué quiere el cliente y observar su experiencia real. Comprender necesidades permite adaptar el servicio y reconocer expectativas incompatibles."], ["Entregar", "Cumplir de forma consistente la experiencia definida. Una atención extraordinaria pierde valor si el servicio habitual incumple."], ["Mejorar gradualmente", "La idea de entregar “más un uno por ciento” representa mejoras continuas sobre una base confiable. Reducir una dificultad repetida puede ser más útil que añadir gestos aislados."], ["Sistemas de servicio", "Comunicación, procesos y preparación del personal hacen repetible la calidad. La experiencia no debe depender únicamente de quién atienda."], ["Coherencia y límites", "La visión del cliente y la de la empresa deben poder coincidir. Prometer algo que no puede sostenerse deteriora la confianza."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Ken Blanchard · Raving Fans; descripción editorial HarperCollins", "url": "https://www.kenblanchardbooks.com/wp-content/uploads/2017/08/Raving-Fans-Read-Sample0001.pdf", "id": "10", "category": "Experiencia", "accent": "#a28b50"}, {"title": "Los cinco niveles de liderazgo", "author": "John C. Maxwell", "idea": "El liderazgo crece mediante influencia. Los niveles se acumulan: producir resultados no elimina la necesidad de cuidar relaciones ni desarrollar a otras personas.", "points": [["Nivel 1 · Posición", "Las personas siguen por la autoridad del puesto. El cargo ofrece responsabilidad y oportunidad para comenzar, pero necesita convertirse en credibilidad."], ["Nivel 2 · Permiso", "Las personas siguen porque quieren. Confianza, escucha y respeto fortalecen la relación; también permiten abordar conversaciones difíciles."], ["Nivel 3 · Producción", "Las personas siguen por los resultados logrados para la organización. El líder convierte objetivos en ejecución y orienta al equipo hacia resultados compartidos."], ["Nivel 4 · Desarrollo de personas", "Las personas siguen por la aportación a su crecimiento. El líder prepara capacidades, delega con orientación y ofrece oportunidades para asumir responsabilidad."], ["Nivel 5 · Cumbre", "La influencia se sostiene en trayectoria, carácter y formación de líderes que desarrollan a otros. Requiere inversión prolongada, no solamente un título."], ["Relaciones diferentes", "Un líder puede estar en niveles distintos con cada persona. El desarrollo requiere atención individual y mantener prácticas de los niveles anteriores."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "John Maxwell · The 5 Levels of Leadership", "url": "https://www.johnmaxwell.com/blog/the-5-levels-of-leadership1/", "id": "11", "category": "Liderazgo", "accent": "#677b93"}, {"title": "Jugar para ganar", "author": "A. G. Lafley y Roger L. Martin", "idea": "La estrategia consiste en un conjunto integrado de elecciones. El libro utiliza experiencias de Procter & Gamble para explicar cómo definir dónde competir y cómo construir una ventaja que pueda sostenerse.", "points": [["Aspiración ganadora", "Definir qué significa ganar para la organización y para los clientes. La aspiración orienta decisiones, pero necesita traducirse en elecciones concretas."], ["Dónde jugar", "Elegir clientes, mercados, canales y ofertas. El alcance importa: intentar servir a todos puede dispersar recursos y debilitar la propuesta."], ["Cómo ganar", "Establecer cómo ofrecer un valor superior dentro del espacio elegido. Dónde competir y cómo ganar deben decidirse conjuntamente."], ["Capacidades esenciales", "Identificar conocimientos, procesos y recursos necesarios para cumplir la propuesta. Las capacidades deben reforzarse entre sí."], ["Sistemas de gestión", "Crear mecanismos de revisión, indicadores y responsabilidades que sostengan las elecciones y permitan aprender."], ["Coherencia y aprendizaje", "Examinar qué tendría que ser cierto para que una opción funcione y comprobar supuestos. Revisar las elecciones cuando cambie la evidencia, sin confundir estrategia con una lista de iniciativas."]], "application": "Elige un problema concreto de tu trabajo. Identifica qué enseñanza puede ayudarte y define una acción, una fecha y un resultado observable.", "tool": "Registra una herramienta de la lectura, cómo la utilizarás y qué evidencia revisarás.", "question": "¿Qué decisión concreta puedo mejorar con esta lectura?", "source": "Harvard Business Review Press · Playing to Win; Roger Martin · Strategy", "url": "https://store.hbr.org/product/playing-to-win-expanded-with-bonus-hbr-articles-how-strategy-really-works/10852", "id": "12", "category": "Estrategia", "accent": "#557f7f"}]</script>
<script>
'use strict';
const BOOKS=JSON.parse(document.getElementById('book-data').textContent);
const LEADERS=[{id:'lector',name:'Mi perfil',role:'Lector',initials:'ML',current:'01',next:'02'}];
const PROMPTS=[
['La frase que me marcó','Copia una cita breve y exacta de tu ejemplar. Indica edición y página; si es una paráfrasis, identifícala.'],
['Lo que entendí distinto','¿Qué creía antes y qué entiendo ahora?'],
['Dónde me vi retratado','¿Qué situación de mi área conecta con esta lectura?'],
['El error que el libro nombra y yo cometo','Describe una conducta concreta, sin etiquetas personales.'],
['La herramienta que me llevo','Una herramienta que pueda utilizar en el trabajo.'],
['Qué aplico en mi área esta semana','Acción concreta, responsable y fecha.'],
['Qué indicador debería moverse y en cuánto','Anota línea base, meta y periodo.'],
['Qué le enseño al equipo en un minuto','Explica la enseñanza con un ejemplo breve.'],
['Qué NO me llevo de este libro y por qué','Evalúa qué requiere adaptación o no corresponde a tu contexto.']];
const KEY='reading-library-v1';
let model={version:1,leader:'lector',entries:{}},storageAvailable=true;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.version===1&&typeof raw.entries==='object'&&raw.entries)model={version:1,leader:LEADERS.some(l=>l.id===raw.leader)?raw.leader:'lector',entries:raw.entries};}catch(e){storageAvailable=false;}
let view='library',category='Todos',query='',statusFilter='all',currentBook=null,currentTab='summary',toastTimer;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const leader=()=>LEADERS.find(l=>l.id===model.leader)||LEADERS[0];
const entryKey=id=>model.leader+':'+id;
function entry(id){const r=model.entries[entryKey(id)]||{};return{...r,status:['unread','reading','done'].includes(r.status)?r.status:'unread',notes:Array.isArray(r.notes)?PROMPTS.map((_,i)=>typeof r.notes[i]==='string'?r.notes[i]:''):Array(9).fill(''),weeks:Array.isArray(r.weeks)?Array.from({length:4},(_,i)=>!!r.weeks[i]):Array(4).fill(false)};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(model));storageAvailable=true;return true;}catch(e){storageAvailable=false;toast('No se pudo guardar. Exporta un respaldo antes de salir.');return false;}}
function patch(id,values){model.entries[entryKey(id)]={...entry(id),...values,updatedAt:new Date().toISOString()};return save();}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4200);}
function statusName(s){return({unread:'Por leer',reading:'En lectura',done:'Completado'})[s]||'Por leer';}
function cover(b){return '<div class="cover" style="--cover:'+b.accent+'"><div class="cover-brand">LECTURAS · '+b.id+'</div><div class="cover-title">'+esc(b.title)+'</div><div class="cover-author">'+esc(b.author)+'</div></div>';}
function card(b){const e=entry(b.id);return '<article class="card"><div class="card-art" style="--art:'+b.accent+'19"><span class="book-num">'+b.id+'</span>'+cover(b)+'</div><div class="card-content"><div class="category">'+esc(b.category)+'</div><h3>'+esc(b.title)+'</h3><div class="author">'+esc(b.author)+'</div><p class="book-description">'+esc(b.idea.split('. ')[0])+'.</p><div class="card-footer"><button class="text-btn" data-open="'+b.id+'">Leer resumen <span aria-hidden="true">↗</span></button><span class="status '+(e.status==='done'?'done':e.status==='reading'?'reading':'')+'">'+statusName(e.status)+'</span></div></div></article>';}
function bottom(){return '<div class="storage"><p>'+(storageAvailable?'Tus notas y avances se guardan en este navegador.':'El almacenamiento no está disponible; exporta un respaldo.')+'<br>No se sincronizan entre dispositivos ni se envían al equipo.</p><div class="backup-actions"><button class="btn light small" id="export">Exportar respaldo ↓</button><button class="btn light small" id="import">Importar respaldo ↑</button></div></div><footer class="footer"><span>BIBLIOTECA DE LECTURA</span><span>CLARIDAD · DIRECCIÓN · RESULTADOS</span></footer>';}
function libraryView(){
const l=leader(),b=BOOKS.find(b=>b.id===l.current);
const done=BOOKS.filter(b=>entry(b.id).status==='done').length,reading=BOOKS.filter(b=>entry(b.id).status==='reading').length,notes=BOOKS.filter(b=>entry(b.id).notes.some(v=>v.trim())).length;
return '<section class="hero"><div><div class="eyebrow">BIBLIOTECA PERSONAL</div><h1>Leer con intención.<br><em>Liderar con claridad.</em></h1><p class="lead">Convierte lo que lees en decisiones para tu área. Explora las ideas, trabaja tus nueve inolvidables y lleva una acción al equipo.</p><button class="btn" data-open="'+b.id+'">Abrir mi lectura <span aria-hidden="true">↗</span></button></div><div class="feature">'+cover(b)+'<div class="feature-info"><span class="pill">Tu lectura asignada</span><h2>'+esc(b.title)+'</h2><p>'+esc(b.author)+'</p><button class="text-btn" data-open="'+b.id+'">Comenzar a leer →</button></div></div></section><div class="stats" aria-label="Tu avance de lectura"><div class="stat"><strong>'+BOOKS.length+'</strong><span>libros disponibles</span></div><div class="stat"><strong>'+reading+'</strong><span>en lectura</span></div><div class="stat"><strong>'+done+'</strong><span>completados</span></div><div class="stat"><strong>'+notes+'</strong><span>cuadernos iniciados</span></div></div><section><div class="section-heading"><div><div class="eyebrow">IDEAS PARA PONER EN PRÁCTICA</div><h2>Tu próxima buena decisión.</h2></div><p id="result-count"></p></div><div class="catalog-tools"><label class="search"><span class="hidden">Buscar libro o autor</span><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" placeholder="Buscar por libro, autor o tema..." value="'+esc(query)+'" autocomplete="off"></label><label><span class="hidden">Filtrar avance</span><select id="statusFilter" class="select"><option value="all">Todos los avances</option><option value="unread">Por leer</option><option value="reading">En lectura</option><option value="done">Completados</option></select></label></div><div class="chips" aria-label="Filtrar por tema">'+['Todos',...new Set(BOOKS.map(b=>b.category))].map(c=>'<button class="chip '+(c===category?'active':'')+'" data-category="'+esc(c)+'" aria-pressed="'+(c===category)+'">'+esc(c)+'</button>').join('')+'</div><div class="grid" id="bookGrid"></div></section>'+bottom();
}
function filterBooks(){return BOOKS.filter(b=>(category==='Todos'||b.category===category)&&(statusFilter==='all'||entry(b.id).status===statusFilter)&&(!query||[b.title,b.author,b.category,b.idea].join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase())));}
function renderGrid(){const b=filterBooks();$('bookGrid').innerHTML=b.length?b.map(card).join(''):'<div class="empty"><h3>No encontramos esa lectura.</h3><p>Prueba otro autor o elimina un filtro.</p><button class="btn light small" id="clearFilters">Limpiar filtros</button></div>';$('result-count').textContent=b.length+' de '+BOOKS.length+' lecturas';bindOpen();if($('clearFilters'))$('clearFilters').onclick=()=>{query='';category='Todos';statusFilter='all';render();};}
function routeView(){const l=leader(),first=BOOKS.find(b=>b.id===l.current),next=BOOKS.find(b=>b.id===l.next);
return '<div class="eyebrow">APRENDIZAJE CON DIRECCIÓN</div><h1 class="page-title">La ruta de '+esc(l.name.split(' ')[0])+'.</h1><p class="page-intro">'+esc(l.role)+' · Trabaja primero tu lectura asignada y aplica una herramienta antes de avanzar a la siguiente.</p><div class="route-grid">'+[[first,'01 · LECTURA ACTUAL'],[next,'02 · SIGUIENTE LECTURA']].map(([b,label])=>'<article class="route-box"><div class="eyebrow">'+label+'</div><h3>'+esc(b.title)+'</h3><p>'+esc(b.author)+'</p><p>'+esc(b.idea)+'</p><button class="btn" data-open="'+b.id+'">Abrir lectura ↗</button></article>').join('')+'</div>'+'<div class="section-heading"><h2>Cuatro semanas para aplicar.</h2></div><div class="route-grid">'+['Comprender el desafío','Revisar la realidad','Elegir una herramienta','Aplicar y comprobar'].map((t,i)=>'<div class="route-box"><div class="eyebrow">SEMANA '+(i+1)+'</div><h3>'+t+'</h3><p>'+['Identifica la idea central y el problema que ayuda a resolver.','Relaciona la lectura con hechos de tu área y revisa supuestos.','Define una acción, un responsable y una fecha.','Comparte evidencia, mide el avance y decide qué ajustar.'][i]+'</p></div>').join('')+'</div><div class="callout">Selecciona tres reflexiones para compartir y define una acción con fecha de revisión.</div>'+bottom();}
function journalView(){const active=BOOKS.filter(b=>entry(b.id).notes.some(v=>v.trim())||entry(b.id).action);return '<div class="eyebrow">REFLEXIÓN QUE SE CONVIERTE EN ACCIÓN</div><h1 class="page-title">Mis nueve inolvidables.</h1><p class="page-intro">Elige una lectura para capturar lo que aprendiste, cuestionar lo que no aplica y definir tu próxima acción. Cuaderno de '+esc(leader().name)+'.</p><div class="callout">Una frase textual necesita edición y página. No atribuyas al autor una paráfrasis ni una experiencia propia.</div><div class="journal-list">'+(active.length?active.map(b=>{const e=entry(b.id),n=e.notes.filter(v=>v.trim()).length;return '<article class="journal-row"><div><h3>'+esc(b.title)+'</h3><p>'+n+' de 9 reflexiones · '+statusName(e.status)+(e.due?' · Fecha de acción: '+esc(e.due):'')+'</p></div><button class="btn light small" data-open="'+b.id+'" data-tab="notes">Continuar →</button></article>';}).join(''):'<div class="empty"><h3>Tu próxima idea empieza aquí.</h3><p>Aún no has escrito reflexiones para este líder.</p><button class="btn" data-open="'+leader().current+'" data-tab="notes">Abrir mi cuaderno ↗</button></div>')+'</div>'+bottom();}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openBook(b.dataset.open,b.dataset.tab||'summary'));}
function render(){
$('app').innerHTML=view==='library'?libraryView():view==='route'?routeView():journalView();
document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false');});
$('crumb').textContent='/ '+({library:'Biblioteca de liderazgo',route:'Mi ruta de lectura',journal:'Mi cuaderno'})[view];
bindOpen();$('export').onclick=exportBackup;$('import').onclick=()=>$('importFile').click();
if(view==='library'){$('statusFilter').value=statusFilter;$('search').oninput=e=>{query=e.target.value;renderGrid();};$('statusFilter').onchange=e=>{statusFilter=e.target.value;renderGrid();};document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;render();});renderGrid();}
}
function summaryTab(b){return '<h3>La idea central</h3><p>'+esc(b.idea)+'</p><h3>Herramientas y enseñanzas</h3>'+b.points.map(([label,text],i)=>'<div class="concept"><b class="num">'+String(i+1).padStart(2,'0')+'</b><div><strong>'+esc(label)+'</strong><p>'+esc(text)+'</p></div></div>').join('')+'<h3>Aplicación personal</h3><p>'+esc(b.application)+'</p><div class="callout"><strong>Herramienta para llevarte</strong><br>'+esc(b.tool)+'</div><div class="question">'+esc(b.question)+'</div>'+(b.filter?'<p>'+esc(b.filter)+'</p>':'')+'<div class="source-note">Resumen temático en palabras propias; no sustituye el libro completo. Las aplicaciones son propuestas de aplicación, no afirmaciones del autor.<br>Fuente: <a href="'+esc(b.url)+'" target="_blank" rel="noopener noreferrer">'+esc(b.source)+' ↗</a></div>';}
function notesTab(b){const e=entry(b.id);return '<div class="notebook-note">Cuaderno de '+esc(leader().name)+'. Guardado automático en este navegador; utiliza el respaldo para llevarlo a otro dispositivo.</div>'+PROMPTS.map(([label,hint],i)=>'<div class="field"><label for="note-'+i+'">'+(i+1)+'. '+label+'</label><small id="hint-'+i+'">'+hint+'</small><textarea id="note-'+i+'" data-note="'+i+'" aria-describedby="hint-'+i+'" placeholder="Escribe tu reflexión...">'+esc(e.notes[i])+'</textarea></div>').join('')+'<div id="saveLine" class="save-line" role="status">'+(e.updatedAt?'Última edición: '+esc(new Date(e.updatedAt).toLocaleString('es-PR')):'Listo para escribir.')+'</div>';}
function planTab(b){const e=entry(b.id),questions=['¿Qué desafío de mi área ayuda a comprender este libro?','¿Qué hechos respaldan mi diagnóstico y qué supuestos debo comprobar?','¿Qué herramienta aplicaré, quién responde y para cuándo?','¿Qué resultado observé y qué necesito ajustar?'];return '<h3>Plan de cuatro semanas</h3><p>Guía de aplicación personal. Marca el avance después de completar cada reflexión.</p>'+questions.map((t,i)=>'<div class="week"><label for="week-'+i+'"><input id="week-'+i+'" type="checkbox" data-week="'+i+'" '+(e.weeks[i]?'checked':'')+'>Semana '+(i+1)+'</label><p>'+t+'</p></div>').join('')+'<h3>Mi compromiso de aplicación</h3><div class="field"><label for="action">Acción concreta</label><textarea id="action" data-field="action" placeholder="Qué voy a implementar...">'+esc(e.action||'')+'</textarea></div><div class="form-grid"><div class="field"><label for="owner">Responsable</label><input id="owner" data-field="owner" value="'+esc(e.owner||leader().name)+'"></div><div class="field"><label for="due">Fecha de revisión</label><input id="due" data-field="due" type="date" value="'+esc(e.due||'')+'"></div></div><div class="field"><label for="metric">Indicador, línea base y meta</label><input id="metric" data-field="metric" placeholder="Qué mediré y qué cambio espero..." value="'+esc(e.metric||'')+'"></div><div class="field"><label for="evidence">Resultado y evidencia</label><textarea id="evidence" data-field="evidence" placeholder="Qué ocurrió después de aplicar...">'+esc(e.evidence||'')+'</textarea></div><div id="saveLine" class="save-line" role="status">Los cambios se guardan al escribir.</div>';}
function openBook(id,tab='summary'){
const b=BOOKS.find(b=>b.id===id);if(!b)return;
currentBook=id;currentTab=tab;const e=entry(id);
$('readerContent').innerHTML='<div class="reader-header"><div class="eyebrow">LECTURA '+b.id+' · '+esc(b.category)+'</div><button class="close" id="closeReader" aria-label="Cerrar lectura">×</button><h2 id="reader-title">'+esc(b.title)+'</h2><div class="author">'+esc(b.author)+'</div><div class="reader-meta"><label for="readStatus" class="author">Mi avance</label><select id="readStatus"><option value="unread">Por leer</option><option value="reading">En lectura</option><option value="done">Completado</option></select><span class="author">'+esc(leader().name)+'</span><button class="btn light small" id="print">Imprimir ficha ↗</button></div></div><div class="tabs" role="tablist" aria-label="Secciones de lectura">'+[['summary','Resumen'],['notes','9 inolvidables'],['plan','Plan de aplicación']].map(([k,t])=>'<button role="tab" id="tab-'+k+'" aria-controls="readerBody" aria-selected="'+(tab===k)+'" data-reader-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+t+'</button>').join('')+'</div><div class="reader-body" id="readerBody" role="tabpanel" aria-labelledby="tab-'+tab+'">'+(tab==='summary'?summaryTab(b):tab==='notes'?notesTab(b):planTab(b))+'</div>';
$('readStatus').value=e.status;$('readStatus').onchange=x=>{patch(id,{status:x.target.value});render();};
$('closeReader').onclick=()=>$('reader').close();$('print').onclick=()=>printBook(b);
document.querySelectorAll('[data-reader-tab]').forEach(t=>t.onclick=()=>openBook(id,t.dataset.readerTab));
document.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{const e=entry(id);e.notes[Number(el.dataset.note)]=el.value;const ok=patch(id,{notes:e.notes});if($('saveLine'))$('saveLine').textContent=ok?'Guardado en este navegador.':'No se pudo guardar; exporta un respaldo.';});
document.querySelectorAll('[data-week]').forEach(el=>el.onchange=()=>{const e=entry(id);e.weeks[Number(el.dataset.week)]=el.checked;patch(id,{weeks:e.weeks});});
document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{const ok=patch(id,{[el.dataset.field]:el.value});if($('saveLine'))$('saveLine').textContent=ok?'Guardado en este navegador.':'No se pudo guardar; exporta un respaldo.';});
if(!$('reader').open)$('reader').showModal();
$('reader').scrollTop=0;
}
function exportBackup(){const data=JSON.stringify({...model,exportedAt:new Date().toISOString()},null,2);download(data,'Lectura_Respaldo_'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Respaldo exportado. Incluye los cuadernos de este navegador.');}
function download(text,name,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function validBackup(d){if(!d||d.version!==1||!d.entries||typeof d.entries!=='object'||Array.isArray(d.entries))return false;const allowed=new Set(LEADERS.flatMap(l=>BOOKS.map(b=>l.id+':'+b.id)));return Object.entries(d.entries).every(([key,v])=>allowed.has(key)&&v&&typeof v==='object'&&!Array.isArray(v)&&(!v.notes||(Array.isArray(v.notes)&&v.notes.length===9&&v.notes.every(x=>typeof x==='string'&&x.length<100000)))&&(!v.status||['unread','reading','done'].includes(v.status))&&['action','owner','due','metric','evidence','updatedAt'].every(k=>v[k]===undefined||typeof v[k]==='string')&&(!v.weeks||(Array.isArray(v.weeks)&&v.weeks.length===4&&v.weeks.every(x=>typeof x==='boolean'))));}
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const d=JSON.parse(await f.text());if(!validBackup(d))throw Error();if(!confirm('Se incorporarán las notas del respaldo. Si existe un cuaderno con el mismo líder y libro, se reemplazará por el del archivo. ¿Continuar?'))return;model.entries={...model.entries,...d.entries};save();render();toast('Respaldo importado.');}catch(err){toast('Archivo no válido. Usa un respaldo JSON exportado desde esta web.');}finally{e.target.value='';}};
function printBook(b){const e=entry(b.id),w=window.open('','_blank');if(!w){toast('Permite abrir la ventana para imprimir la ficha.');return;}w.addEventListener('load',()=>w.print(),{once:true});w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+esc(b.title)+' · Lectura</title><style>body{font:12px/1.7 Arial,sans-serif;color:#243b48;max-width:760px;margin:40px auto;padding:0 25px}h1,h2{font-family:Georgia,serif}h1{font-size:30px}h2{font-size:20px;margin-top:28px}h3{font-size:13px}p{white-space:pre-wrap}header{border-bottom:2px solid #b79561;padding-bottom:20px}small{color:#66746d}@media print{body{margin:0;max-width:none}button{display:none}h2,h3{break-after:avoid}p{orphans:3;widows:3}}</style></head><body><header><small>BIBLIOTECA DE LECTURA · LECTURA Y APRENDIZAJE</small><h1>'+esc(b.title)+'</h1><p>'+esc(b.author)+'<br>Cuaderno de '+esc(leader().name)+'</p></header><h2>Idea central</h2><p>'+esc(b.idea)+'</p>'+b.points.map(([t,p])=>'<h3>'+esc(t)+'</h3><p>'+esc(p)+'</p>').join('')+'<h2>Aplicación personal</h2><p>'+esc(b.application)+'</p><h2>Las nueve inolvidables</h2>'+PROMPTS.map(([t],i)=>'<h3>'+(i+1)+'. '+esc(t)+'</h3><p>'+esc(e.notes[i]||'Pendiente de completar.')+'</p>').join('')+'<h2>Compromiso</h2><p>'+esc(e.action||'Pendiente de definir.')+'</p><p>Responsable: '+esc(e.owner||leader().name)+'<br>Fecha: '+esc(e.due||'Pendiente')+'<br>Indicador: '+esc(e.metric||'Pendiente')+'</p><p>'+esc(e.evidence||'')+'</p><small>Resumen temático en palabras propias. Las aplicaciones son propuestas de aplicación. Fuente: '+esc(b.source)+'</small></body></html>');w.document.close();}
$('leader').innerHTML=LEADERS.map(l=>'<option value="'+l.id+'">'+esc(l.name)+' · '+esc(l.role)+'</option>').join('');$('leader').value=model.leader;$('avatar').textContent=leader().initials;
$('leader').onchange=e=>{model.leader=e.target.value;save();$('avatar').textContent=leader().initials;render();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'});});
$('reader').addEventListener('close',()=>{currentBook=null;render();});
$('reader').addEventListener('click',e=>{if(e.target===$('reader')){const r=$('reader').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('reader').close();}});
render();
</script>
</body></html>
